interface:
  display_name: "TeamShared Memory"
  short_description: "Recall and preserve shared team context every turn"
  default_prompt: "Recall shared team context, then continue; commit the outcome."

dependencies:
  tools:
    - type: "mcp"
      value: "teamshared"
      description: "TeamShared persistent team memory"
      transport: "streamable_http"
      url: "https://teamshared.com/mcp"

policy:
  allow_implicit_invocation: true
