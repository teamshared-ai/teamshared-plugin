name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Cursor plugin
        run: ./scripts/validate.sh
